<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Game</title>
<style>
:root{--bg:#f2efe8;--ink:#1d2a2f;--mute:#6b777b;--acc:#2f6f73;--acc2:#b4532a;--card:#fff;--line:#d8d3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.25 Georgia,"Iowan Old Style",serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;box-sizing:border-box;padding:16px 22px 64px;text-align:center;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;align-self:center;
min-height:min(calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),502px);
min-height:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),502px)}
#app{flex:1;display:flex;flex-direction:column;gap:4px}
#done,#go,#nx,#end,#begin{flex:none}
.btns{display:flex;gap:10px}
.btns button{flex:1}
footer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:8px 22px;text-align:center;font-size:12px;line-height:1.4;color:var(--mute);pointer-events:none}
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding-top:4px}
h1{font-size:26px;margin:0;line-height:1.1}
p{margin:0;color:var(--mute)}
input{font:inherit;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-weight:bold;padding:10px 18px;border:2px solid transparent;border-radius:10px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px}.row input{flex:1}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pair{font-size:44px;line-height:1.1;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.pair b{color:var(--acc2);font-weight:normal;font-style:italic}
.ghost{background:transparent;color:var(--mute);border:2px solid var(--line)}
.hide{display:none}
.list{text-align:left;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{font-size:15px;line-height:1.2;padding:0 10px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.done{color:var(--ink);font-weight:bold}
.title{font-size:32px;line-height:1.1;color:var(--acc);margin:0}
.results{overflow:hidden}
.modelabel{color:var(--mute);font-size:21px;margin-top:6px;margin-bottom:-2px}
.intro{font-size:16px;line-height:1.35;text-wrap:balance;max-width:22em;margin:0 auto}
.stage.mid{justify-content:flex-start;gap:0;padding-top:0}
.stage.mid .modelabel{margin:0 0 4px}
.sp{flex:1}
.sp2{flex:1}
.mode{display:flex;flex-direction:column}
.seg{display:flex;align-items:center;justify-content:center;gap:10px}
.seg span{color:var(--mute)}
.seg button{flex:1;font-size:15px;padding:7px 10px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.done{min-height:1.25em}
.bar{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;background:var(--acc)}
.status{min-height:1.25em}

h1.tall{min-height:2.3em}
.list li.new{border-color:var(--acc2)}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.list .w{min-width:0;overflow:hidden;text-overflow:ellipsis}
.list li.bonus{border-color:#d9a21b;background:rgba(233,180,58,.22);font-weight:bold}
.tag{flex:none;font-size:11px;font-weight:bold;color:var(--acc2)}
.list b{color:var(--acc2);font-weight:normal;font-style:italic}
</style>
</head>
<body>
<main><div class="title">The Word Game</div><div id="app"></div></main>
<footer>This game does not collect, store, or transmit your entries.<br>&copy; 2026 The Word Game</footer>
<script>
var ADJ=[],NOUN=[],pairs=[],idx=0,N=5;
var app=document.getElementById("app");

function wrap(){
  var btn=app.querySelector("#done,#go,#nx,#end,#begin");
  var st=document.createElement("div");st.className="stage";
  while(app.firstChild&&app.firstChild!==btn)st.appendChild(app.firstChild);
  app.insertBefore(st,btn);
}
function shareResults(btn){
  var lines=pairs.map(function(p,i){return (i+1)+". "+p[0]+" "+p[1]});
  var text="The Word Game results:\n"+lines.join("\n");
  var url=location.href.split("#")[0];
  if(navigator.share){navigator.share({title:"The Word Game",text:text,url:url}).catch(function(){});return}
  var full=text+"\n"+url;
  function copied(){var o=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=o},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(full).then(copied,function(){window.prompt("Copy your results:",full)});
  else window.prompt("Copy your results:",full);
}
function lead(w){return w.replace(/^[^A-Za-z\u00C0-\u024F]+/,"").charAt(0).toLowerCase()}
function alliterates(a,b){var x=lead(a);return x!==""&&x===lead(b)}
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var old=document.getElementById("confetti");if(old)old.remove();
  var c=document.createElement("canvas");c.id="confetti";c.setAttribute("aria-hidden","true");
  c.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50";
  var W=window.innerWidth,H=window.innerHeight,dpr=window.devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
  var g=c.getContext&&c.getContext("2d");if(!g){c.remove();return}
  g.scale(dpr,dpr);
  var cols=["#e9b43a","#b4532a","#2f6f73","#6fc0c4","#d94f70","#7b5ea7"],ps=[],i;
  for(i=0;i<110;i++){var ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,sp=6+Math.random()*8;
    ps.push({x:W/2,y:H*0.45,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,s:5+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})}
  var t0=null,D=2600;
  function frame(t){
    if(t0===null)t0=t;var e=t-t0;
    if(e>D){c.remove();return}
    g.clearRect(0,0,W,H);g.globalAlpha=e>D-600?(D-e)/600:1;
    ps.forEach(function(p){p.vy+=0.22;p.vx*=0.985;p.vy*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);g.restore()});
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function intro(next){
  app.innerHTML='<p class="intro">One player adds adjectives, the other adds nouns. Neither sees the other&rsquo;s words until the game pairs them up and reveals each match.</p><div class="sp"></div><div class="mode"><div class="modelabel" id="modelabel">Select Game Mode</div><div class="seg" id="seg" role="group" aria-labelledby="modelabel"><button data-n="5">5 word pairs</button><button data-n="10">10 word pairs</button></div></div><div class="sp2"></div><button id="begin">Begin</button>';
  wrap();
  document.querySelector("#app .stage").className="stage mid";
  var btns=document.getElementById("seg").querySelectorAll("button");
  function paint(){Array.prototype.forEach.call(btns,function(b){var on=Number(b.getAttribute("data-n"))===N;b.className=on?"on":"";b.setAttribute("aria-pressed",on)})}
  Array.prototype.forEach.call(btns,function(b){b.onclick=function(){N=Number(b.getAttribute("data-n"));paint()}});
  document.getElementById("begin").onclick=next;
  paint();
}

function collect(kind,list,next,btn){
  var label=kind==="adj"?"adjective":"noun";
  app.innerHTML='<h1>Player '+(kind==="adj"?1:2)+': Enter '+N+' '+label+'s</h1>'+
  '<p>Words are hidden as you add them.</p>'+
  '<div class="row"><input id="w" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Enter one '+label+'" placeholder="One '+label+'"><button id="add">Add</button></div>'+
  '<div class="dots" id="dots" aria-live="polite"></div>'+
  '<button id="done" disabled>'+btn+'</button>';
  wrap();
  var w=document.getElementById("w"),dots=document.getElementById("dots"),done=document.getElementById("done");
  function draw(){var h="";for(var i=0;i<N;i++)h+='<i class="'+(i<list.length?"on":"")+'"></i>';dots.innerHTML=h;
    dots.setAttribute("aria-label",list.length+" of "+N+" entered");
    w.disabled=list.length>=N;document.getElementById("add").disabled=list.length>=N;done.disabled=list.length<N}
  function add(){var v=w.value.trim();if(!v||list.length>=N)return;list.push(v);w.value="";draw();w.focus()}
  document.getElementById("add").onclick=add;
  w.onkeydown=function(e){if(e.key==="Enter")add()};
  done.onclick=next;
  draw();w.focus();
}

function reveal(){
  pairs=ADJ.map(function(x,i){return[x,NOUN[i]]});idx=-1;
  app.innerHTML='<h1 id="ph">Please Stand By</h1><p>Prepare for a written opus rendering descriptive gibberish amusingly meaningful enigmas.</p>'+
  '<div class="bar" id="bar" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>'+
  '<p class="status" id="status" aria-live="polite">&nbsp;</p>'+
  '<button id="go" style="visibility:hidden">Show Results</button>';
  wrap();
  var fill=document.getElementById("fill"),status=document.getElementById("status"),bar=document.getElementById("bar"),go=document.getElementById("go");
  var msgs=["Initiating hyperlinguistic analysis...","Sequencing typographic protocols...","Delineating grammatical preformatives...","Condensing lexicographical coupling...","Finalizing hapax legomena configuration..."];
  void fill.offsetWidth;
  fill.style.transition="width 7s linear";fill.style.width="100%";
  msgs.forEach(function(m,i){setTimeout(function(){status.textContent=m},i*1400)});
  setTimeout(function(){document.getElementById("ph").textContent="READY";status.innerHTML="&nbsp;";bar.setAttribute("aria-valuenow","100");go.style.visibility="visible";go.focus()},7000);
  go.onclick=function(){idx=0;show()};
}
function show(){
  var html='<h1>Results</h1><div class="results" style="height:'+(N*24)+'px"><ul class="list" aria-live="polite">';
  for(var i=0;i<=idx;i++){var bn=alliterates(pairs[i][0],pairs[i][1]);
    html+='<li class="'+(i===idx?'new':'')+(bn?' bonus':'')+'"><span class="w">'+esc(pairs[i][0])+' <b>'+esc(pairs[i][1])+'</b></span>'+(bn?'<span class="tag">&#9733; Alliteration bonus</span>':'')+'</li>'}
  html+='</ul></div><p>Pairing '+(idx+1)+' of '+N+'</p>';
  html+='<div class="done">'+(idx===N-1?'Word Game Complete.':'')+'</div>';
  if(idx<N-1)html+='<button id="nx">Show next pairing</button>';
  else html+='<div id="end" class="btns"><button id="share">Share Results</button><button id="again" class="ghost">Play again</button></div>';
  app.innerHTML=html;wrap();
  if(alliterates(pairs[idx][0],pairs[idx][1]))confetti();
  var nx=document.getElementById("nx");if(nx)nx.onclick=function(){idx++;show()};
  var ag=document.getElementById("again");if(ag)ag.onclick=start;
  var sh=document.getElementById("share");if(sh)sh.onclick=function(){shareResults(sh)};
}

function start(){
  ADJ=[];NOUN=[];
  intro(function(){
    collect("adj",ADJ,function(){
      collect("noun",NOUN,reveal,"Process Word Game Results");
    },"Ready Player 2");
  });
}
start();
</script>
</body>
</html>
