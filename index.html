<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Game</title>
<style>
:root{--bg:#f2efe8;--ink:#1d2a2f;--mute:#566266;--acc:#2f6f73;--acc2:#b4532a;--card:#fff;--line:#d8d3c7;--edge:#9a9486;--h:524px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;--edge:#5a7270;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;--edge:#5a7270;color-scheme:dark}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.3 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
main{width:100%;max-width:480px;box-sizing:border-box;padding:16px 22px 64px;text-align:center;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;align-self:center;
min-height:min(calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),var(--h));
min-height:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),var(--h))}
#app{flex:1;display:flex;flex-direction:column;gap:4px}
#done,#go,#nx,#end,#begin,#inv,#jb,#lb{flex:none}
.btns{display:flex;gap:10px}
.btns button{flex:1}
footer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:8px 22px;text-align:center;font-size:12px;line-height:1.4;letter-spacing:.01em;color:var(--mute);pointer-events:none}
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding-top:4px}
h1,.title,.intro,.modelabel,.list li{font-family:var(--serif)}
h1{font-size:26px;margin:0;line-height:1.1}
.tag{font-family:var(--sans)}
p{margin:0;color:var(--mute)}
input{font:inherit;padding:11px 14px;border:2px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-weight:600;letter-spacing:.01em;padding:10px 18px;border:2px solid transparent;border-radius:12px;background:var(--acc);color:var(--bg);cursor:pointer;transition:filter .15s,transform .1s}
@media (hover:hover){button:not(:disabled):hover{filter:brightness(1.1)}}
button:not(:disabled):active{transform:scale(.98)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px}.row input{flex:1}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pair{font-size:44px;line-height:1.1;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.pair b{color:var(--acc2);font-weight:normal;font-style:italic}
.ghost{background:transparent;color:var(--mute);border:2px solid var(--edge)}
.hide{display:none}
.list{text-align:left;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{display:flex;align-items:center;gap:6px}
.list .box{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;font-size:15px;line-height:1.2;padding:0 10px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.done{color:var(--ink);font-weight:bold}
.title{font-size:clamp(30px,8.2vw,36px);letter-spacing:.01em;line-height:1.1;color:var(--acc);margin:0 0 22px}
.results{overflow:hidden}
.modelabel{color:var(--mute);font-size:21px;margin-top:6px;margin-bottom:8px}
.intro{font-size:16px;line-height:1.35;text-wrap:balance;max-width:22em;margin:0 auto}
.stage.mid{justify-content:flex-start;gap:0;padding-top:0}
.stage.mid .modelabel{margin:0 0 10px}
.sp{flex:1}
.sp2{flex:1}
.mode{display:flex;flex-direction:column}
.seg{display:flex;align-items:center;justify-content:center;gap:10px}
.seg span{color:var(--mute)}
.seg button{flex:1;font-size:15px;padding:7px 10px;background:var(--card);color:var(--ink);border:2px solid var(--edge)}
.seg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.done{min-height:1.25em}
.bar{height:14px;border:2px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;background:var(--acc)}
.status{min-height:1.25em}

h1.tall{min-height:2.3em}
.list .box.new{border-color:var(--acc2)}
.list .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.list .heart{flex:none;display:inline-flex;align-items:center;justify-content:center;height:26px;margin:-4px 0 -4px -8px;padding:0 8px;background:transparent;color:var(--mute);border:0;border-radius:6px;font-size:14px;line-height:1}
@media (hover:hover){.list .heart:not(:disabled):hover{color:#d6336c;filter:none}}
.list .box.bonus{border-color:#d9a21b;background:rgba(233,180,58,.22);font-weight:bold}
.list .tag{flex:none;max-width:62%;height:26px;line-height:26px;margin:-4px 0;padding:0 0 0 6px;background:transparent;border:0;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:bold;letter-spacing:0;color:var(--acc2);font-family:var(--sans)}
#bpop{position:fixed;z-index:60;background:var(--card);color:var(--ink);border:2px solid #d9a21b;border-radius:12px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);font:600 14px/1.6 var(--sans);text-align:left;white-space:nowrap}
#bpop span{color:var(--acc2)}
.list b{color:var(--acc2);font-weight:normal;font-style:italic}
@media (max-width:359px){:root{--h:544px}button{font-size:15px;padding-left:12px;padding-right:12px}}
@media (min-width:640px){:root{--h:498px}
main{padding:20px 32px 28px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 40px rgba(29,42,47,.08)}
.list .box,input,.seg button:not(.on){background:var(--bg)}}
@media (min-height:560px){main{transform:translateY(-11px)}}
.mode .modelabel+.seg+.modelabel{margin-top:14px}
.optlabel{font:700 24px/1.2 var(--serif);color:var(--ink);margin-bottom:10px}
.seg button{white-space:nowrap}
.code{font:700 44px/1 var(--serif);letter-spacing:.2em;color:var(--acc);padding:6px 0 6px .2em}
#rc{text-align:center;text-transform:uppercase;letter-spacing:.2em;font-size:22px}

</style>
</head>
<body>
<main><div class="title">The Word Game</div><div id="app"></div></main>
<footer><span id="ft">This game does not collect, store, or transmit your entries.</span><br>&copy; 2026 The Word Game</footer>
<script>
var ADJ=[],NOUN=[],pairs=[],idx=0,N=5,favs=[];
var app=document.getElementById("app");

function wrap(){
  var btn=app.querySelector("#done,#go,#nx,#end,#begin,#inv,#jb,#lb");
  var st=document.createElement("div");st.className="stage";
  while(app.firstChild&&app.firstChild!==btn)st.appendChild(app.firstChild);
  app.insertBefore(st,btn);
}
function shareResults(btn){
  var lines=pairs.map(function(p,i){return (i+1)+". "+p[0]+" "+p[1]+(favs[i]?" \u2764\uFE0F":"")});
  var text="The Word Game results:\n"+lines.join("\n");
  var url=location.href.split("#")[0];
  var full=text+"\n"+url;
  function copied(){var o=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=o},1500)}
  function fallback(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      try{navigator.clipboard.writeText(full).then(copied,function(){window.prompt("Copy your results:",full)})}
      catch(e){window.prompt("Copy your results:",full)}
    }else window.prompt("Copy your results:",full);
  }
  if(navigator.share){
    var d={title:"The Word Game",text:text};
    if(/^https?:/.test(url))d.url=url;
    try{navigator.share(d).catch(function(e){if(!e||e.name!=="AbortError")fallback()})}
    catch(e){fallback()}
  }else fallback();
}
function heartHTML(on){return on?"\u2764\uFE0F":'<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'}
function clean(w){return w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function unique(w){return w.length>=4&&new Set(w.split("")).size===w.length}
function bonuses(a,b){
  var x=clean(a),y=clean(b),r=[];
  if(!x||!y)return r;
  if(x[0]===y[0])r.push("Alliteration");
  if(unique(x)&&unique(y))r.push("Isogram");
  if(x.length>=3&&y.length>=3&&x.slice(-2)===y.slice(-2))r.push("Homoioteleuton");
  if(x.slice(-1)===y[0])r.push("Anadiplosis");
  return r;
}
function closePop(){var p=document.getElementById("bpop");if(p)p.remove();Array.prototype.forEach.call(document.querySelectorAll(".tag"),function(t){t.setAttribute("aria-expanded","false")})}
function openPop(btn,list){
  closePop();
  var p=document.createElement("div");p.id="bpop";p.setAttribute("role","dialog");p.setAttribute("aria-label","Bonuses");
  p.innerHTML=list.map(function(n){return '<div><span>&#9733;</span> '+n+'</div>'}).join("");
  document.body.appendChild(p);btn.setAttribute("aria-expanded","true");
  var r=btn.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  var left=Math.max(8,Math.min(r.right-w,window.innerWidth-w-8)),top=r.bottom+6;
  if(top+h>window.innerHeight-8)top=r.top-h-6;
  p.style.left=left+"px";p.style.top=top+"px";
}
function tagText(l){return l.slice(0,2).join(" \u00b7 ")+(l.length>2?" +"+(l.length-2):"")}
function confetti(n){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var old=document.getElementById("confetti");if(old)old.remove();
  var c=document.createElement("canvas");c.id="confetti";c.setAttribute("aria-hidden","true");
  c.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50";
  var W=window.innerWidth,H=window.innerHeight,dpr=window.devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
  var g=c.getContext&&c.getContext("2d");if(!g){c.remove();return}
  g.scale(dpr,dpr);
  var cols=["#e9b43a","#b4532a","#2f6f73","#6fc0c4","#d94f70","#7b5ea7"],ps=[],i,count=110+40*Math.min((n||1)-1,3);
  for(i=0;i<count;i++){var ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,sp=6+Math.random()*8;
    ps.push({x:W/2,y:H*0.45,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,s:5+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})}
  var t0=null,D=2600;
  function frame(t){
    if(t0===null)t0=t;var e=t-t0;
    if(e>D){c.remove();return}
    g.clearRect(0,0,W,H);g.globalAlpha=e>D-600?(D-e)/600:1;
    ps.forEach(function(p){p.vy+=0.22;p.vx*=0.985;p.vy*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);g.restore()});
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
}
var PM="local",role=null,socket=null,myReady=false,theirReady=false,remoteIdx=-1,started=false,resultsOn=false,procDone=false,ended=false,ROOM=null;
var ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
try{var q=new URLSearchParams(location.search).get("room");if(q&&/^[A-Za-z0-9]{4}$/.test(q))ROOM=q.toUpperCase()}catch(e){}
function isRemote(){return PM!=="local"}
function setFooter(){var f=document.getElementById("ft");if(f)f.textContent=isRemote()?"Your words are relayed to your opponent and aren\u2019t stored.":"This game does not collect, store, or transmit your entries."}
function screen(h){app.innerHTML=h;wrap()}
function closeRemote(){
  if(socket){
    socket.onopen=socket.onmessage=socket.onerror=socket.onclose=null;
    try{socket.close()}catch(e){}
  }
  socket=null;role=null;myReady=false;theirReady=false;remoteIdx=-1;started=false;resultsOn=false;procDone=false;ended=false;
}
function roomURL(code,who){return "wss://peer.thewordgame.net/room/"+code+"?role="+who}
function send(o){try{if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(o))}catch(e){}}
function notice(msg){screen('<h1>Online Play</h1><p>'+msg+'</p><button id="lb">Back to Start</button>');document.getElementById("lb").onclick=start}
function lost(){
  if(started||ended)return;ended=true;
  screen('<h1>Connection Lost</h1><p>The other player disconnected.</p><button id="lb">Back to Start</button>');
  document.getElementById("lb").onclick=start;
}
function shareInvite(code,btn){
  var url=location.origin+location.pathname+"?room="+code,text="Join my Word Game. Room code: "+code;
  function copy(){var full=text+"\n"+url;
    if(navigator.clipboard&&navigator.clipboard.writeText){try{navigator.clipboard.writeText(full).then(function(){var o=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=o},1500)},function(){window.prompt("Copy this invite:",full)})}catch(e){window.prompt("Copy this invite:",full)}}
    else window.prompt("Copy this invite:",full)}
  if(navigator.share){var d={title:"The Word Game",text:text};if(/^https?:/.test(url))d.url=url;
    try{navigator.share(d).catch(function(e){if(!e||e.name!=="AbortError")copy()})}catch(e){copy()}}
  else copy();
}
function beginEntry(){
  if(role==="host")collect("adj",ADJ,mineDone,"Process Word Game Results");
  else collect("noun",NOUN,mineDone,"Process Word Game Results");
}
function mineDone(){myReady=true;send({t:"words",list:role==="host"?ADJ:NOUN});maybeStart()}
function maybeStart(){
  if(myReady&&theirReady){if(!started){started=true;reveal()}}
  else if(myReady)screen('<h1>Waiting for the other player&hellip;</h1><p>Your words stay hidden until you are both ready.</p>');
}
function onData(m){
  if(!m||typeof m!=="object")return;
  if(m.t==="peer-left"){lost()}
  else if(m.t==="hello"&&role==="guest"){N=m.n===10?10:5;beginEntry()}
  else if(m.t==="words"&&Array.isArray(m.list)){
    var l=m.list.slice(0,N).map(function(x){return String(x).trim().slice(0,30)});
    if(l.length!==N||l.some(function(x){return !x}))return;
    if(role==="host")NOUN=l;else ADJ=l;
    theirReady=true;maybeStart();
  }
}
function sendIdx(){}
function hostGame(){
  closeRemote();role="host";
  var code="",i;for(i=0;i<4;i++)code+=ALPHA.charAt(Math.floor(Math.random()*ALPHA.length));
  screen('<h1>Your Room Code</h1><div class="code" aria-label="Room code '+code.split("").join(" ")+'">'+code+'</div><p id="hs">Setting up&hellip;</p><button id="inv" disabled>Share Invite</button>');
  var hs=document.getElementById("hs"),inv=document.getElementById("inv");
  shareInvite(code,inv);
  socket=new WebSocket(roomURL(code,"host"));
  socket.onopen=function(){hs.innerHTML="Waiting for Player 2&hellip;";inv.disabled=false;inv.onclick=function(){shareInvite(code,inv)}};
  socket.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==="guest-connected"){send({t:"hello",n:N});beginEntry()}else onData(m);
  };
  socket.onerror=function(){ended=true;notice("Couldn&rsquo;t set up the room. Check your connection and try again.")};
  socket.onclose=lost;
}
function joinScreen(code){
  screen('<h1>Join a Game</h1><p>Enter the room code.</p><input id="rc" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" value="'+(code||"")+'"><p class="status" id="js">&nbsp;</p><button id="jb">Join</button>');
  var rc=document.getElementById("rc"),js=document.getElementById("js"),jb=document.getElementById("jb");
  function go(){
    var c=rc.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(c.length!==4){js.textContent="Enter the 4-character code.";return}
    closeRemote();role="guest";jb.disabled=true;js.textContent="Connecting\u2026";
    var done=false,t=setTimeout(function(){fail("Couldn\u2019t connect. Check the code and try again.")},40000);
    function fail(msg){
      if(done)return;done=true;clearTimeout(t);jb.disabled=false;js.textContent=msg;
      if(socket){socket.onopen=socket.onmessage=socket.onerror=socket.onclose=null;try{socket.close()}catch(e){}socket=null}
    }
    function attempt(){
      if(done)return;
      var opened=false,s=new WebSocket(roomURL(c,"guest"));socket=s;
      s.onopen=function(){opened=true;clearTimeout(t);js.textContent="Connected\u2026"};
      s.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}onData(m)};
      s.onerror=function(){};
      s.onclose=function(){
        if(done)return;
        if(socket===s)socket=null;
        if(opened){lost();return}
        js.textContent="Waiting for the host\u2026";
        setTimeout(attempt,3000);
      };
    }
    attempt();
  }
  jb.onclick=go;rc.onkeydown=function(e){if(e.key==="Enter")go()};
  if(code)go();else rc.focus();
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function intro(next){
  app.innerHTML='<p class="intro">One player adds adjectives, the other adds nouns. Neither sees the other&rsquo;s words until the game pairs them up and reveals each match.</p><div class="sp"></div><div class="mode"><div class="optlabel">Options</div><div class="modelabel" id="ml1">Game Mode</div><div class="seg" id="seg" role="group" aria-labelledby="ml1"><button data-n="5">5 word pairs</button><button data-n="10">10 word pairs</button></div><div class="modelabel" id="ml2">Play Mode</div><div class="seg" id="seg2" role="group" aria-labelledby="ml2"><button data-m="local">Local Game</button><button data-m="remote">Remote Game</button></div></div><div class="sp2"></div><button id="begin">Begin</button>';
  wrap();
  var nb=document.getElementById("seg").querySelectorAll("button"),mb=document.getElementById("seg2").querySelectorAll("button");
  function paint(){
    Array.prototype.forEach.call(nb,function(b){var on=Number(b.getAttribute("data-n"))===N;b.className=on?"on":"";b.setAttribute("aria-pressed",on)});
    Array.prototype.forEach.call(mb,function(b){var on=b.getAttribute("data-m")===PM;b.className=on?"on":"";b.setAttribute("aria-pressed",on)});
    document.getElementById("begin").textContent=PM==="remote"?"Share Invite":"Begin";
    setFooter();
  }
  Array.prototype.forEach.call(nb,function(b){b.onclick=function(){N=Number(b.getAttribute("data-n"));paint()}});
  Array.prototype.forEach.call(mb,function(b){b.onclick=function(){PM=b.getAttribute("data-m");paint()}});
  document.getElementById("begin").onclick=next;
  paint();
}

function collect(kind,list,next,btn){
  var label=kind==="adj"?"adjective":"noun";
  app.innerHTML='<h1>Player '+(kind==="adj"?1:2)+': Enter '+N+' '+label+'s</h1>'+
  '<p>Words are hidden as you add them.</p>'+
  '<div class="row"><input id="w" type="text" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Enter one '+label+'" placeholder="One '+label+'"><button id="add">Add</button></div>'+
  '<div class="dots" id="dots" aria-live="polite"></div>'+
  '<button id="done" disabled>'+btn+'</button>';
  wrap();
  var w=document.getElementById("w"),dots=document.getElementById("dots"),done=document.getElementById("done");
  function draw(){var h="";for(var i=0;i<N;i++)h+='<i class="'+(i<list.length?"on":"")+'"></i>';dots.innerHTML=h;
    dots.setAttribute("aria-label",list.length+" of "+N+" entered");
    w.disabled=list.length>=N;document.getElementById("add").disabled=list.length>=N;done.disabled=list.length<N}
  function add(){var v=w.value.trim();if(!v||list.length>=N)return;list.push(v);w.value="";draw();w.focus()}
  document.getElementById("add").onclick=add;
  w.onkeydown=function(e){if(e.key==="Enter")add()};
  done.onclick=next;
  draw();w.focus();
}

function reveal(){
  procDone=false;pairs=ADJ.map(function(x,i){return[x,NOUN[i]]});idx=-1;favs=pairs.map(function(){return false});
  app.innerHTML='<h1 id="ph">Please Stand By</h1><p>To Hatch Ephemeral Written Opus Rendering Descriptive Gibberish Amusingly Meaningful Enigmas</p>'+
  '<div class="bar" id="bar" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>'+
  '<p class="status" id="status" aria-live="polite">&nbsp;</p>'+
  '<button id="go" style="visibility:hidden">Show Results</button>';
  wrap();
  var fill=document.getElementById("fill"),status=document.getElementById("status"),bar=document.getElementById("bar"),go=document.getElementById("go");
  var msgs=["Initiating hyperlinguistic analysis...","Sequencing typographic protocols...","Delineating grammatical preformatives...","Condensing lexicographical coupling...","Finalizing hapax legomena configuration..."];
  void fill.offsetWidth;
  fill.style.transition="width 7s linear";fill.style.width="100%";
  msgs.forEach(function(m,i){setTimeout(function(){status.textContent=m},i*1400)});
  setTimeout(function(){procDone=true;if(isRemote()&&remoteIdx>=0){idx=remoteIdx;show();return}document.getElementById("ph").textContent="READY";status.innerHTML="&nbsp;";bar.setAttribute("aria-valuenow","100");go.style.visibility="visible";go.focus()},7000);
  go.onclick=function(){idx=Math.max(0,remoteIdx);show();sendIdx()};
}
function show(){
  closePop();resultsOn=true;
  var html='<h1>Results</h1><div class="results" style="height:'+(N*24)+'px"><ul class="list" aria-live="polite">';
  for(var i=0;i<=idx;i++){var bl=bonuses(pairs[i][0],pairs[i][1]),bn=bl.length>0;
    html+='<li><button class="heart" data-i="'+i+'" aria-pressed="'+(favs[i]?'true':'false')+'" aria-label="Favorite pairing: '+esc(pairs[i][0])+' '+esc(pairs[i][1])+'">'+heartHTML(favs[i])+'</button><span class="box'+(i===idx?' new':'')+(bn?' bonus':'')+'"><span class="w">'+esc(pairs[i][0])+' <b>'+esc(pairs[i][1])+'</b></span>'+(bn?'<button type="button" class="tag" data-i="'+i+'" aria-expanded="false" aria-label="Bonuses: '+esc(bl.join(", "))+'. Show all">&#9733; '+esc(tagText(bl))+'</button>':'')+'</span></li>'}
  html+='</ul></div><p>Pairing '+(idx+1)+' of '+N+'</p>';
  html+='<div class="done">'+(idx===N-1?'Word Game Complete.':'')+'</div>';
  if(idx<N-1)html+='<button id="nx">Show next pairing</button>';
  else html+='<div id="end" class="btns"><button id="share">Share Results</button><button id="again" class="ghost">Play again</button></div>';
  app.innerHTML=html;wrap();
  var cb=bonuses(pairs[idx][0],pairs[idx][1]).length;if(cb)confetti(cb);
  Array.prototype.forEach.call(document.querySelectorAll(".heart"),function(b){b.onclick=function(){var i=Number(b.getAttribute("data-i"));favs[i]=!favs[i];b.setAttribute("aria-pressed",favs[i]?"true":"false");b.innerHTML=heartHTML(favs[i])}});
  Array.prototype.forEach.call(document.querySelectorAll(".tag"),function(t){t.onclick=function(e){e.stopPropagation();var was=t.getAttribute("aria-expanded")==="true";closePop();if(!was){var i=Number(t.getAttribute("data-i"));openPop(t,bonuses(pairs[i][0],pairs[i][1]))}}});
  var nx=document.getElementById("nx");if(nx)nx.onclick=function(){idx=Math.min(N-1,Math.max(idx+1,remoteIdx));show();sendIdx()};
  var ag=document.getElementById("again");if(ag)ag.onclick=start;
  var sh=document.getElementById("share");if(sh)sh.onclick=function(){shareResults(sh)};
}

function startLocal(){
  collect("adj",ADJ,function(){
    collect("noun",NOUN,reveal,"Process Word Game Results");
  },"Ready Player 2");
}
function start(){
  closeRemote();ADJ=[];NOUN=[];
  if(ROOM){var c=ROOM;ROOM=null;PM="remote";setFooter();joinScreen(c);return}
  intro(function(){
    if(PM==="remote")hostGame();
    else startLocal();
  });
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(e){}}});
document.addEventListener("click",closePop);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePop()});
start();
</script>
</body>
