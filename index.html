<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Game</title>
<style>
:root{--bg:#f2efe8;--ink:#1d2a2f;--mute:#6b777b;--acc:#2f6f73;--acc2:#b4532a;--card:#fff;--line:#d8d3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.4 Georgia,"Iowan Old Style",serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;box-sizing:border-box;padding:28px 22px 60px;display:flex;flex-direction:column;justify-content:flex-start;gap:18px;align-self:center;
min-height:min(calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),760px);
min-height:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),760px)}
#app{flex:1;display:flex;flex-direction:column;gap:18px}
#done,#go,#nx,#end,#begin{flex:none}
.btns{display:flex;gap:10px}
.btns button{flex:1}
footer{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:8px 22px;text-align:center;font-size:12px;line-height:1.4;color:var(--mute);pointer-events:none}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:30px;margin:0;line-height:1.15}
p{margin:0;color:var(--mute)}
input{font:inherit;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-weight:bold;padding:14px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px}.row input{flex:1}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pair{font-size:44px;line-height:1.1;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.pair b{color:var(--acc2);font-weight:normal;font-style:italic}
.ghost{background:transparent;color:var(--mute);border:2px solid var(--line)}
.hide{display:none}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.list li{font-size:16px;line-height:1.3;padding:2px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.done{color:var(--ink);font-weight:bold}
.title{font-size:40px;line-height:1.1;color:var(--acc);margin:0}
.results{overflow:hidden}
.modelabel{color:var(--mute);margin-bottom:-10px}
.seg{display:flex;align-items:center;gap:10px}
.seg span{color:var(--mute)}
.seg button{flex:1;font-size:15px;padding:7px 10px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.done{min-height:1.4em}
h1.tall{min-height:2.3em}
.list li.new{border-color:var(--acc2)}
.list b{color:var(--acc2);font-weight:normal;font-style:italic}
</style>
</head>
<body>
<main><div class="title">The Word Game</div><div id="app"></div></main>
<footer>This game does not collect, store, or transmit your entries.<br>&copy; 2026 The Word Game</footer>
<script>
var ADJ=[],NOUN=[],pairs=[],idx=0,N=5;
var app=document.getElementById("app");

function wrap(){
  var btn=app.querySelector("#done,#go,#nx,#end,#begin");
  var st=document.createElement("div");st.className="stage";
  while(app.firstChild&&app.firstChild!==btn)st.appendChild(app.firstChild);
  app.insertBefore(st,btn);
}
function shareResults(btn){
  var lines=pairs.map(function(p,i){return (i+1)+". "+p[0]+" "+p[1]});
  var text="The Word Game results:\n"+lines.join("\n");
  var url=location.href.split("#")[0];
  if(navigator.share){navigator.share({title:"The Word Game",text:text,url:url}).catch(function(){});return}
  var full=text+"\n"+url;
  function copied(){var o=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=o},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(full).then(copied,function(){window.prompt("Copy your results:",full)});
  else window.prompt("Copy your results:",full);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function intro(next){
  app.innerHTML='<div class="modelabel" id="modelabel">Game Mode</div><div class="seg" id="seg" role="group" aria-labelledby="modelabel"><button data-n="5">5 word pairs</button><button data-n="10">10 word pairs</button></div><button id="begin">Begin</button>';
  wrap();
  var btns=document.getElementById("seg").querySelectorAll("button");
  function paint(){Array.prototype.forEach.call(btns,function(b){var on=Number(b.getAttribute("data-n"))===N;b.className=on?"on":"";b.setAttribute("aria-pressed",on)})}
  Array.prototype.forEach.call(btns,function(b){b.onclick=function(){N=Number(b.getAttribute("data-n"));paint()}});
  document.getElementById("begin").onclick=next;
  paint();
}

function collect(kind,list,next){
  var label=kind==="adj"?"adjective":"noun";
  app.innerHTML='<h1>Player '+(kind==="adj"?1:2)+': Enter '+N+' '+label+'s</h1>'+
  '<p>Words are hidden as you add them.</p>'+
  '<div class="row"><input id="w" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Enter one '+label+'" placeholder="One '+label+'"><button id="add">Add</button></div>'+
  '<div class="dots" id="dots" aria-live="polite"></div>'+
  '<button id="done" disabled>Ready to pass the device</button>';
  wrap();
  var w=document.getElementById("w"),dots=document.getElementById("dots"),done=document.getElementById("done");
  function draw(){var h="";for(var i=0;i<N;i++)h+='<i class="'+(i<list.length?"on":"")+'"></i>';dots.innerHTML=h;
    dots.setAttribute("aria-label",list.length+" of "+N+" entered");
    w.disabled=list.length>=N;document.getElementById("add").disabled=list.length>=N;done.disabled=list.length<N}
  function add(){var v=w.value.trim();if(!v||list.length>=N)return;list.push(v);w.value="";draw();w.focus()}
  document.getElementById("add").onclick=add;
  w.onkeydown=function(e){if(e.key==="Enter")add()};
  done.onclick=next;
  draw();w.focus();
}

function handoff(msg,sub,btn,next){
  app.innerHTML='<h1>'+msg+'</h1><p>'+sub+'</p><button id="go">'+btn+'</button>';
  wrap();
  document.getElementById("go").onclick=next;
}

function reveal(){
  var a=shuffle(ADJ),n=shuffle(NOUN);pairs=a.map(function(x,i){return[x,n[i]]});idx=-1;
  show();
}
function show(){
  var html;
  if(idx<0)html='<h1>Hyperlinguistic Analysis Completed</h1><p>Prepare for a written opus rendering descriptive gibberish amusingly meaningful enigmas.</p>';
  else{
    html='<h1>Results</h1><div class="results" style="height:'+(N*33)+'px"><ul class="list" aria-live="polite">';
    for(var i=0;i<=idx;i++)html+='<li class="'+(i===idx?'new':'')+'">'+esc(pairs[i][0])+' <b>'+esc(pairs[i][1])+'</b></li>';
    html+='</ul></div><p>Pairing '+(idx+1)+' of '+N+'</p>';
    html+='<div class="done">'+(idx===N-1?'Word Game Complete.':'')+'</div>';
  }
  if(idx<N-1)html+='<button id="nx">'+(idx<0?"Show Results":"Show next pairing")+'</button>';
  else html+='<div id="end" class="btns"><button id="share">Share Results</button><button id="again" class="ghost">Play again</button></div>';
  app.innerHTML=html;wrap();
  var nx=document.getElementById("nx");if(nx)nx.onclick=function(){idx++;show()};
  var ag=document.getElementById("again");if(ag)ag.onclick=start;
  var sh=document.getElementById("share");if(sh)sh.onclick=function(){shareResults(sh)};
}

function start(){
  ADJ=[];NOUN=[];
  intro(function(){
    collect("adj",ADJ,function(){
      handoff("Pass to Player 2","Ready when you are.","Ready",function(){
        collect("noun",NOUN,function(){
          handoff("This is an announcement.","The announcement has concluded.","Process Word Game Results",reveal);
        });
      });
    });
  });
}
start();
</script>
</body>
</html>
