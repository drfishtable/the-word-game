<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Game</title>
<style>
:root{--bg:#f2efe8;--ink:#1d2a2f;--mute:#6b777b;--acc:#2f6f73;--acc2:#b4532a;--card:#fff;--line:#d8d3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201f;--ink:#ece8dc;--mute:#93a3a1;--acc:#6fc0c4;--acc2:#e9895a;--card:#1d2e2d;--line:#2f4442;color-scheme:dark}
html{height:100%}body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.4 Georgia,"Iowan Old Style",serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;box-sizing:border-box;padding:28px 22px;display:flex;flex-direction:column;justify-content:flex-start;gap:18px;align-self:center;
min-height:min(calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),760px);
min-height:min(calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),760px)}
#done,#go,#nx,#again{flex:none}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:30px;margin:0;line-height:1.15}
p{margin:0;color:var(--mute)}
input{font:inherit;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
input:focus{outline:3px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-weight:bold;padding:14px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px}.row input{flex:1}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pair{font-size:44px;line-height:1.1;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.pair b{color:var(--acc2);font-weight:normal;font-style:italic}
.ghost{background:transparent;color:var(--mute);border:2px solid var(--line)}
.hide{display:none}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.list li{font-size:16px;line-height:1.3;padding:2px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.done{color:var(--ink);font-weight:bold}
.title{font-size:40px;line-height:1.1;color:var(--acc);margin:0}
.results{height:330px;overflow:hidden}
.done{min-height:1.4em}
h1.tall{min-height:2.3em}
.list li.new{border-color:var(--acc2)}
.list b{color:var(--acc2);font-weight:normal;font-style:italic}
</style>
</head>
<body>
<main id="app"></main>
<script>
var ADJ=[],NOUN=[],pairs=[],idx=0;
var app=document.getElementById("app");

function wrap(){
  var btn=app.querySelector("#done,#go,#nx,#again");
  var st=document.createElement("div");st.className="stage";
  while(app.firstChild&&app.firstChild!==btn)st.appendChild(app.firstChild);
  app.insertBefore(st,btn);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function collect(kind,list,next,title){
  var label=kind==="adj"?"adjective":"noun";
  app.innerHTML=(title?'<div class="title">'+title+'</div>':'')+'<h1>Player '+(kind==="adj"?1:2)+': Enter '+(kind==="adj"?'ten':'10')+' '+label+'s</h1>'+
  '<p>Words are hidden as you add them.</p>'+
  '<div class="row"><input id="w" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Enter one '+label+'" placeholder="One '+label+'"><button id="add">Add</button></div>'+
  '<div class="dots" id="dots" aria-live="polite"></div>'+
  '<button id="done" disabled>Ready to pass the device</button>';
  wrap();
  var w=document.getElementById("w"),dots=document.getElementById("dots"),done=document.getElementById("done");
  function draw(){var h="";for(var i=0;i<10;i++)h+='<i class="'+(i<list.length?"on":"")+'"></i>';dots.innerHTML=h;
    dots.setAttribute("aria-label",list.length+" of 10 entered");
    w.disabled=list.length>=10;document.getElementById("add").disabled=list.length>=10;done.disabled=list.length<10}
  function add(){var v=w.value.trim();if(!v||list.length>=10)return;list.push(v);w.value="";draw();w.focus()}
  document.getElementById("add").onclick=add;
  w.onkeydown=function(e){if(e.key==="Enter")add()};
  done.onclick=next;
  draw();w.focus();
}

function handoff(msg,sub,btn,next){
  app.innerHTML='<h1>'+msg+'</h1><p>'+sub+'</p><button id="go">'+btn+'</button>';
  wrap();
  document.getElementById("go").onclick=next;
}

function reveal(){
  var a=shuffle(ADJ),n=shuffle(NOUN);pairs=a.map(function(x,i){return[x,n[i]]});idx=-1;
  show();
}
function show(){
  var html='<h1 class="tall">'+(idx<0?'Hyperlinguistic Analysis Completed':'Results')+'</h1><div class="results">';
  if(idx<0)html+='<p>Prepare for a written opus rendering descriptive gibberish amusingly meaningful enigmas.</p>';
  else{
    html+='<ul class="list" aria-live="polite">';
    for(var i=0;i<=idx;i++)html+='<li class="'+(i===idx?'new':'')+'">'+esc(pairs[i][0])+' <b>'+esc(pairs[i][1])+'</b></li>';
    html+='</ul>';
  }
  html+='</div><p>'+(idx<0?'&nbsp;':'Pairing '+(idx+1)+' of 10')+'</p>';
  html+='<div class="done">'+(idx===9?'Word Game Complete.':'')+'</div>';
  if(idx<9)html+='<button id="nx">'+(idx<0?"Show Results":"Show next pairing")+'</button>';
  else html+='<button id="again" class="ghost">Play again</button>';
  app.innerHTML=html;wrap();
  var nx=document.getElementById("nx");if(nx)nx.onclick=function(){idx++;show()};
  var ag=document.getElementById("again");if(ag)ag.onclick=start;
}

function start(){
  ADJ=[];NOUN=[];
  collect("adj",ADJ,function(){
    handoff("Pass to Player 2","Ready when you are.","Ready",function(){
      collect("noun",NOUN,function(){
        handoff("This is an announcement.","The announcement has concluded.","Process Word Game Results",reveal);
      });
    });
  },"The Word Game");
}
start();
</script>
</body>
</html>
